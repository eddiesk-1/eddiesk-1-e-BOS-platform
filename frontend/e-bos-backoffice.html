<script>
/* ============ Partnerships & Equity (owner/partner only) ============ */
registerView('equity', async function(body){
  var bizId = appState.currentBusinessId;
  var partnerships = [], currentRule = null, people = [];
  try { partnerships = await Backend.listPartnerships(bizId); } catch(e){}
  try { currentRule = await Backend.getCurrentAllocationRule(bizId); } catch(e){}
  try { people = await Backend.listPeople(); } catch(e){}
  var peopleById = {}; people.forEach(function(p){ peopleById[p.id] = p; });
  function personName(id){ return peopleById[id] ? peopleById[id].name : id.slice(0,8)+'…'; }

  body.innerHTML =
    '<p style="color:var(--text-muted); font-size:0.9rem; margin:0 0 18px;">Ownership records and the current profit-split rule. Allocation rules are append-only — correcting a split means posting a new version, never editing an old one.</p>' +
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">' +
      '<div>' +
        '<div class="card glass" style="margin-bottom:16px;">' +
          '<b style="display:block; margin-bottom:12px;">Partnerships</b>' +
          (partnerships.length === 0 ? '<p style="color:var(--text-muted); font-size:0.85rem;">None recorded yet.</p>' :
            '<table><tbody>' + partnerships.map(function(p){
              return '<tr><td>'+escapeHtml(personName(p.personId))+'</td><td>'+p.ownershipPct+'%</td><td>'+Number(p.capitalContributed||0).toLocaleString()+'</td></tr>';
            }).join('') + '</tbody></table>') +
        '</div>' +
        '<div class="card glass" style="margin-bottom:16px;">' +
          '<b style="display:block; margin-bottom:6px;">Add a partnership</b>' +
          '<p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:12px;">Records who owns what share of this business. Profit splits are set separately by the allocation rule.</p>' +
          '<div class="form-row"><label>Person</label><select class="pship-person"><option value="">Choose…</option>' +
            people.map(function(p){ return '<option value="' + p.id + '">' + escapeHtml(p.name) + ' (' + p.role + ')</option>'; }).join('') + '</select></div>' +
          '<div class="form-grid">' +
            '<div class="form-row"><label>Ownership %</label><input class="pship-pct" type="number" min="0" max="100" step="0.01" /></div>' +
            '<div class="form-row"><label>Capital contributed</label><input class="pship-capital" type="number" min="0" step="0.01" /></div>' +
          '</div>' +
          '<button class="btn btn-primary pship-add-btn">Add partnership</button>' +
        '</div>' +
        '<div class="card glass">' +
          '<b style="display:block; margin-bottom:12px;">Current allocation rule</b>' +
          (currentRule
            ? '<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">Version ' + currentRule.version + ', effective ' + new Date(currentRule.effectiveFrom).toLocaleDateString() + '</p>' +
              '<table><tbody>' + (currentRule.splits||[]).map(function(s){ return '<tr><td>'+escapeHtml(personName(s.personId))+'</td><td>'+s.pct+'%</td></tr>'; }).join('') + '</tbody></table>'
            : '<p style="color:var(--text-muted); font-size:0.85rem;">No allocation rule is currently in effect.</p>') +
        '</div>' +
      '</div>' +
      '<div class="card glass">' +
        '<b style="display:block; margin-bottom:4px;">Post a new allocation rule</b>' +
        '<p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:14px;">Any person — owner, partner, or worker — can hold a slice. Drag a slider and the OTHER unlocked ones adjust to keep the set at exactly 100; lock a person\'s slider (the 🔒 button) to hold their share still while you move the rest.</p>' +
        '<div class="eq-rows"></div>' +
        '<div class="eq-sum-readout"></div>' +
        '<select class="add-person-select" style="width:100%; padding:9px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:8px; color:var(--text); margin:10px 0;">' +
          '<option value="">+ Add a person to this split…</option>' +
        '</select>' +
        '<div class="form-row"><label>Effective from</label><input type="date" class="rule-effective-from" /></div>' +
        '<button class="btn btn-primary post-rule-btn">Post rule</button>' +
      '</div>' +
    '</div>';

  body.querySelector('.pship-add-btn').addEventListener('click', async function(){
    var personId = body.querySelector('.pship-person').value;
    var pct = Number(body.querySelector('.pship-pct').value);
    var capitalRaw = body.querySelector('.pship-capital').value;
    if (!personId){ appToast('Choose a person.', 'error'); return; }
    if (!(pct >= 0 && pct <= 100) || body.querySelector('.pship-pct').value === ''){ appToast('Ownership must be between 0 and 100.', 'error'); return; }
    var already = partnerships.reduce(function(a, p){ return a + Number(p.ownershipPct || 0); }, 0);
    if (already + pct > 100.0001){ appToast('That would take total ownership to ' + (Math.round((already + pct) * 100) / 100) + '% — it cannot exceed 100%.', 'error'); return; }
    var req = { businessId: bizId, personId: personId, ownershipPct: pct };
    if (capitalRaw !== '') req.capitalContributed = Number(capitalRaw);
    var btn = this; btn.disabled = true;
    try { await Backend.createPartnership(req); appToast('Partnership added.', 'success'); reloadCurrentCard('equity'); }
    catch(err){ appToast('Could not add the partnership: ' + err.message, 'error'); btn.disabled = false; }
  });

  /* ============ Allocation slider state + redistribution ============
     splitState: [{ id: personId, pct, locked }]. redistributeSplits()
     is the one function that knows how a drag propagates — verified in
     isolation (basic redistribution, a locked slider, over-drag
     clamping, an all-zero-others division-by-zero case, and negative
     input) before ever being wired to a DOM element, the same
     discipline as this file's other real interactive components. */
  function redistributeSplits(splits, draggedId, newValue){
    var lockedSum = splits.filter(function(s){ return s.locked && s.id !== draggedId; })
                           .reduce(function(sum,s){ return sum + s.pct; }, 0);
    var others = splits.filter(function(s){ return s.id !== draggedId && !s.locked; });
    var maxAllowed = 100 - lockedSum;
    var clamped = Math.max(0, Math.min(maxAllowed, newValue));
    var remainder = maxAllowed - clamped;
    var othersCurrentSum = others.reduce(function(sum,s){ return sum + s.pct; }, 0);
    return splits.map(function(s){
      if (s.id === draggedId) return Object.assign({}, s, { pct: clamped });
      if (s.locked) return s;
      if (othersCurrentSum === 0) return Object.assign({}, s, { pct: others.length > 0 ? remainder / others.length : 0 });
      var share = s.pct / othersCurrentSum;
      return Object.assign({}, s, { pct: remainder * share });
    });
  }

  var splitState = [];
  // Seed from the currently-effective rule if one exists — editing
  // starts from reality, not from zero, every time this card loads.
  if (currentRule && currentRule.splits && currentRule.splits.length > 0){
    splitState = currentRule.splits.map(function(s){ return { id: s.personId, pct: s.pct, locked: false }; });
  } else if (people.length > 0){
    // No rule yet: seed one person at 100 rather than an ambiguous empty split.
    splitState = [{ id: people[0].id, pct: 100, locked: false }];
  }

  var eqRowsEl = body.querySelector('.eq-rows');
  var sumEl = body.querySelector('.eq-sum-readout');

  function renderSplitRows(){
    eqRowsEl.innerHTML = splitState.map(function(s){
      var person = peopleById[s.id];
      var name = person ? person.name : s.id.slice(0,8)+'…';
      return '<div class="eq-row" data-id="'+s.id+'">' +
        '<span class="eq-row-name" title="'+escapeHtml(name)+'">'+escapeHtml(name)+'</span>' +
        '<div class="eq-slider-h'+(s.locked?' locked':'')+'" style="--eq-value:'+(s.pct/100)+';">' +
          '<div class="eq-fill-h"></div><div class="eq-thumb-h"></div>' +
        '</div>' +
        '<span class="eq-pct-readout">'+s.pct.toFixed(1)+'%</span>' +
        '<button class="eq-lock-btn'+(s.locked?' locked':'')+'" title="'+(s.locked?'Unlock':'Lock')+' this share">🔒</button>' +
        '<button class="eq-remove-btn" title="Remove from split">×</button>' +
      '</div>';
    }).join('');

    var sum = splitState.reduce(function(t,s){ return t+s.pct; }, 0);
    var balanced = Math.abs(sum - 100) < 0.05;
    sumEl.className = 'eq-sum-readout ' + (balanced ? 'balanced' : 'unbalanced');
    sumEl.textContent = 'Sum: ' + sum.toFixed(1) + '%' + (balanced ? ' ✓ balanced' : ' — must be exactly 100');

    // Wire drag + lock + remove for each row just rendered.
    eqRowsEl.querySelectorAll('.eq-row').forEach(function(row){
      var id = row.getAttribute('data-id');
      var sliderEl = row.querySelector('.eq-slider-h');
      var dragging = false;
      function isLocked(){ return splitState.find(function(s){ return s.id===id; }).locked; }
      function applyFromEvent(e){
        if (isLocked()) return;
        var rect = sliderEl.getBoundingClientRect();
        var x = (e.touches ? e.touches[0].clientX : e.clientX);
        var fraction = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
        splitState = redistributeSplits(splitState, id, fraction * 100);
        renderSplitRows();
      }
      sliderEl.addEventListener('pointerdown', function(e){ dragging = true; sliderEl.setPointerCapture(e.pointerId); applyFromEvent(e); });
      sliderEl.addEventListener('pointermove', function(e){ if (dragging) applyFromEvent(e); });
      sliderEl.addEventListener('pointerup', function(e){ dragging = false; try { sliderEl.releasePointerCapture(e.pointerId); } catch(err){} });
      sliderEl.addEventListener('pointercancel', function(){ dragging = false; });

      row.querySelector('.eq-lock-btn').addEventListener('click', function(){
        var entry = splitState.find(function(s){ return s.id===id; });
        entry.locked = !entry.locked;
        renderSplitRows();
      });
      row.querySelector('.eq-remove-btn').addEventListener('click', function(){
        // Removal is treated as dragging that person to zero first —
        // their share redistributes to the others, THEN they're
        // dropped, so the remaining set is still exactly 100.
        splitState = redistributeSplits(splitState, id, 0).filter(function(s){ return s.id !== id; });
        renderSplitRows();
        refreshAddPersonOptions();
      });
    });
  }
  renderSplitRows();

  var addSelect = body.querySelector('.add-person-select');
  function refreshAddPersonOptions(){
    // Rebuilt from scratch each time, not incrementally patched — a
    // person removed from the split needs to become addable again
    // immediately, which an earlier version of this view got wrong by
    // only ever REMOVING an option on add and never restoring it on
    // remove, permanently hiding anyone who'd been added-then-removed
    // in the same session until the card was reloaded.
    var placeholder = '<option value="">+ Add a person to this split…</option>';
    addSelect.innerHTML = placeholder + people
      .filter(function(p){ return !splitState.some(function(s){ return s.id === p.id; }); })
      .map(function(p){ return '<option value="'+p.id+'">'+escapeHtml(p.name)+' ('+p.role+')</option>'; }).join('');
  }
  refreshAddPersonOptions();
  addSelect.addEventListener('change', function(){
    if (!addSelect.value) return;
    var newId = addSelect.value;
    // Adding a person is the inverse of removing: they enter unlocked
    // at 0, then an immediate redistribution pulls a fair share from
    // the other unlocked sliders — never silently pushing the total
    // over 100 by just appending a nonzero value on top of an
    // already-balanced set.
    splitState.push({ id: newId, pct: 0, locked: false });
    var evenShare = 100 / splitState.filter(function(s){ return !s.locked; }).length;
    splitState = redistributeSplits(splitState, newId, evenShare);
    renderSplitRows();
    refreshAddPersonOptions();
  });

  body.querySelector('.post-rule-btn').addEventListener('click', async function(){
    var effectiveFrom = body.querySelector('.rule-effective-from').value;
    var sum = splitState.reduce(function(s,x){ return s+x.pct; }, 0);
    if (splitState.length === 0 || !effectiveFrom){ appToast('At least one person and an effective date are required.', 'error'); return; }
    if (Math.abs(sum - 100) > 0.05){ appToast('Splits must sum to exactly 100 (currently ' + sum.toFixed(1) + ').', 'error'); return; }
    try {
      await Backend.createAllocationRule({
        businessId: bizId,
        effectiveFrom: new Date(effectiveFrom).toISOString(),
        splits: splitState.map(function(s){ return { personId: s.id, pct: Math.round(s.pct * 100) / 100 }; })
      });
      appToast('Allocation rule posted.', 'success');
      reloadCurrentCard('equity');
    } catch(err){ appToast('Failed: ' + err.message, 'error'); }
  });
});
</script>
<script>
/* ============ Chat Inbox ============ */
registerView('inbox', async function(body){
  var bizId = appState.currentBusinessId;
  var conversations = await Backend.listConversations(bizId);

  body.innerHTML =
    '<p style="color:var(--text-muted); font-size:0.9rem; margin:0 0 18px;">Consumer conversations. "Awaiting human" means a customer needs a person: they redeemed an order code, asked for someone, raised a complaint or a pricing question, or the AI wasn\'t sure. Eligible staff are notified (bell icon, and by email when email is set up).</p>' +
    '<div style="display:grid; grid-template-columns:300px 1fr; gap:0; border:1px solid var(--glass-border); border-radius:14px; overflow:hidden; min-height:440px;">' +
      '<div class="conv-list" style="border-right:1px solid var(--glass-border); overflow-y:auto; max-height:560px; background:rgba(255,255,255,0.02);"></div>' +
      '<div class="conv-thread" style="padding:18px;"><div class="empty-state">Select a conversation.</div></div>' +
    '</div>';

  var listEl = body.querySelector('.conv-list');
  if (conversations.length === 0){
    listEl.innerHTML = '<div class="empty-state">No conversations yet.</div>';
    return;
  }
  var STATUS_PILL = { ai: 'pill-muted', awaiting_human: 'pill-warn', staff: 'pill-good' };
  var REASON_LABEL = { visitor_token_redeemed: 'Customer redeemed an order code', pricing: 'Pricing or custom quote', complaint: 'Complaint or problem', low_confidence: 'The AI was not sure', visitor_requested: 'Customer asked for a person' };
  listEl.innerHTML = conversations.map(function(c){
    return '<div class="conv-item' + (c.handledBy === 'awaiting_human' ? ' waiting' : '') + '" data-id="'+c.id+'" style="padding:13px 15px; border-bottom:1px solid var(--glass-border); cursor:pointer; transition:background 0.2s var(--spring-soft);">' +
      '<div style="font-weight:500; font-size:0.9rem; margin-bottom:4px;">' + escapeHtml(c.visitorDisplayName || c.subject || 'Anonymous visitor') + '</div>' +
      '<span class="pill ' + (STATUS_PILL[c.handledBy]||'pill-muted') + '">' + c.handledBy.replace('_',' ') + '</span>' +
      (c.identified ? ' <span class="pill pill-accent">identified</span>' : '') +
      (c.handoffReason ? '<div style="font-size:0.74rem; color:var(--text-muted); margin-top:4px;">' + escapeHtml(REASON_LABEL[c.handoffReason] || '') + '</div>' : '') +
    '</div>';
  }).join('');

  listEl.querySelectorAll('.conv-item').forEach(function(item){
    item.addEventListener('click', function(){ loadThread(item.getAttribute('data-id')); });
  });

  async function loadThread(convId){
    var threadEl = body.querySelector('.conv-thread');
    threadEl.innerHTML = '<div class="empty-state">Loading…</div>';
    var data, routing = null;
    try { data = await Backend.getConversationThread(convId); } catch(err){ threadEl.innerHTML = '<div class="error-banner">'+escapeHtml(err.message)+'</div>'; return; }
    if (data.conversation.handledBy === 'awaiting_human'){
      try { routing = await Backend.getRoutingCandidates(convId); } catch(e){}
    }
    var SENDER_LABEL = { visitor: 'Visitor', ai: 'AI', person: 'Staff' };
    threadEl.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">' +
        '<span class="pill ' + (STATUS_PILL[data.conversation.handledBy]||'pill-muted') + '">' + data.conversation.handledBy.replace('_',' ') + '</span>' +
        (data.conversation.handledBy === 'awaiting_human' ? '<button class="btn btn-primary claim-btn">Claim this conversation</button>' : '') +
      '</div>' +
      (data.conversation.handoffReason ? '<p style="font-size:0.82rem; color:var(--text-muted); margin:0 0 12px;">Why a person is needed: ' + escapeHtml(REASON_LABEL[data.conversation.handoffReason] || data.conversation.handoffReason) + '</p>' : '') +
      (routing ? '<div class="card glass" style="margin-bottom:14px; font-size:0.85rem; padding:14px;"><b>Suggested (by declared region, not distance)</b><br/>' +
        routing.candidates.map(function(c){ return escapeHtml(c.name) + (c.exactRegionMatch?' — exact region match':c.handlesAnywhere?' — handles anywhere':' — no region match'); }).join('<br/>') +
        '</div>' : '') +
      '<div class="thread-messages" style="display:flex; flex-direction:column; gap:10px; margin-bottom:14px; max-height:300px; overflow-y:auto;">' +
        data.messages.map(function(m){
          return '<div style="align-self:'+(m.senderType==='visitor'?'flex-start':'flex-end')+'; max-width:75%;">' +
            '<div style="font-size:0.72rem; color:var(--text-muted); margin-bottom:2px;">' + SENDER_LABEL[m.senderType] + '</div>' +
            '<div class="card glass" style="padding:9px 13px; font-size:0.88rem;">' + escapeHtml(m.body) + '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div style="display:flex; gap:8px;"><input class="staff-reply-input" placeholder="Reply as staff…" style="flex:1; padding:10px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:8px; color:var(--text);" /><button class="btn btn-primary staff-reply-btn">Send</button></div>';

    var claimBtn = threadEl.querySelector('.claim-btn');
    if (claimBtn) claimBtn.addEventListener('click', async function(){
      try { await Backend.claimConversation(convId); appToast('Claimed.', 'success'); loadThread(convId); }
      catch(err){ appToast('Failed: ' + err.message, 'error'); }
    });
    threadEl.querySelector('.staff-reply-btn').addEventListener('click', async function(){
      var input = threadEl.querySelector('.staff-reply-input');
      var msg = input.value.trim();
      if (!msg) return;
      try { await Backend.postStaffMessage(convId, msg); input.value=''; loadThread(convId); }
      catch(err){ appToast('Failed: ' + err.message, 'error'); }
    });
  }
});
</script>

        '</div>' +
        '<div style="border-top:1px solid var(--glass-border); padding-top:14px;">' +
          '<b style="display:block; margin-bottom:8px; font-size:0.88rem;">Ingest a guide</b>' +
          '<p style="color:var(--text-muted); font-size:0.78rem; margin-bottom:8px;">Requires a provider key saved above first.</p>' +
          '<div class="form-row"><textarea class="guide-text" rows="6" placeholder="Paste your operating guide text…"></textarea></div>' +
          '<button class="btn ingest-guide-btn">Ingest guide</button>' +
          '<div class="ingest-preview" style="margin-top:12px;"></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // Retrieval depth and auto-escalation are real, server-side settings
  // (PUT /businesses/:id/ai-settings). Workers can see them but not change them.
  var canEditAi = appState.auth.person.role !== 'worker';
  var aiStatus = body.querySelector('.ai-settings-status');
  var aiTimer = null;
  async function saveAiSettings(patch){
    aiStatus.textContent = 'Saving…';
    try {
      var r = await Backend.putAiSettings(bizId, patch);
      aiStatus.textContent = 'Saved — the AI now reads ' + r.retrievalDepth + ' chunks per reply; automatic hand-off is ' + (r.autoEscalation ? 'on' : 'off') + '.';
    } catch(err){
      aiStatus.textContent = err.status === 403 ? 'Only owners and partners can change this.' : 'Could not save: ' + err.message;
    }
  }
  var previewDepth = createEqSlider(body.querySelector('#preview-depth-slider'), {
    min: 1, max: 20, value: 8,
    onChange: function(v){
      if (!canEditAi) return;
      clearTimeout(aiTimer);
      aiTimer = setTimeout(function(){ saveAiSettings({ retrievalDepth: Math.round(v) }); }, 600);
    }
  });
  var autoBox = body.querySelector('.ai-auto-escalate');
  autoBox.disabled = !canEditAi;
  autoBox.addEventListener('change', function(){ saveAiSettings({ autoEscalation: autoBox.checked }); });
  if (bizId){
    Backend.getAiSettings(bizId).then(function(r){ previewDepth.setValue(r.retrievalDepth); autoBox.checked = r.autoEscalation; })
      .catch(function(){ aiStatus.textContent = 'Could not load the current setting.'; });
  }

  // ---- invite / add people (owners)
  body.querySelectorAll('.invite-btn').forEach(function(btn){
    btn.addEventListener('click', async function(){
      btn.disabled = true;
      try { await Backend.invitePerson(btn.getAttribute('data-id')); appToast('Invitation emailed to ' + btn.getAttribute('data-name') + '.', 'success'); }
      catch(err){ appToast('Could not invite: ' + err.message, 'error'); }
      finally { setTimeout(function(){ btn.disabled = false; }, 4000); }
    });
  });
  var addPersonBtn = body.querySelector('.add-person-btn');
  if (addPersonBtn) addPersonBtn.addEventListener('click', async function(){
    var name = body.querySelector('.np-name').value.trim();
    var email = body.querySelector('.np-email').value.trim();
    var role = body.querySelector('.np-role').value;
    if (!name || !email){ appToast('Name and email are required.', 'error'); return; }
    addPersonBtn.disabled = true;
    var created;
    try { created = await Backend.createPerson({ name: name, email: email, role: role }); }
    catch(err){ appToast('Could not add the person: ' + err.message, 'error'); addPersonBtn.disabled = false; return; }
    try { await Backend.invitePerson(created.id); appToast(name + ' was added and an invitation was emailed.', 'success'); }
    catch(err){ appToast(name + ' was added, but the invitation could not be sent: ' + err.message, 'error'); }
    reloadCurrentCard('people');
  });

  body.querySelector('.save-loc-btn').addEventListener('click', async function(){
    var lat = body.querySelector('.loc-lat').value;
    var lng = body.querySelector('.loc-lng').value;
    var label = body.querySelector('.loc-label').value.trim();
    var reqBody = {};
    if (lat !== '') reqBody.latitude = Number(lat);
    if (lng !== '') reqBody.longitude = Number(lng);
    if (label) reqBody.locationLabel = label;
    if (Object.keys(reqBody).length === 0){ appToast('Nothing to save.', 'error'); return; }
    try { await Backend.updateMyLocation(reqBody); appToast('Location saved.', 'success'); }
    catch(err){ appToast('Failed: ' + err.message, 'error'); }
  });

  var pathRowsEl = body.querySelector('.path-rows');
  function addPathRow(region, types){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:8px; margin-bottom:8px;';
    row.innerHTML =
      '<input class="path-region" placeholder="Region (blank = anywhere)" value="'+(region?escapeHtml(region):'')+'" style="flex:1; padding:8px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:8px; color:var(--text);" />' +
      '<input class="path-types" placeholder="Types, comma-separated" value="'+(types?escapeHtml(types.join(", ")):'')+'" style="flex:1; padding:8px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:8px; color:var(--text);" />' +
      '<button class="btn remove-path-row" style="padding:6px 10px;">×</button>';
    row.querySelector('.remove-path-row').addEventListener('click', function(){ row.remove(); });
    pathRowsEl.appendChild(row);
  }
  myPaths.forEach(function(p){ addPathRow(p.regionLabel, p.transactionTypes); });
  if (myPaths.length === 0) addPathRow();
  body.querySelector('.add-path-row-btn').addEventListener('click', function(){ addPathRow(); });

  body.querySelector('.save-paths-btn').addEventListener('click', async function(){
    var rows = pathRowsEl.querySelectorAll('div');
    var paths = [];
    rows.forEach(function(row){
      var region = row.querySelector('.path-region').value.trim();
      var typesRaw = row.querySelector('.path-types').value.trim();
      var types = typesRaw ? typesRaw.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];
      if (types.length > 0) paths.push({ regionLabel: region || null, transactionTypes: types });
    });
    try { await Backend.setMyTransactionPaths(paths); appToast('Coverage saved.', 'success'); }
    catch(err){ appToast('Failed: ' + err.message, 'error'); }
  });

  body.querySelector('.save-integration-btn').addEventListener('click', async function(){
    var provider = body.querySelector('.int-provider').value;
    var key = body.querySelector('.int-key').value.trim();
    if (!key){ appToast('An API key is required.', 'error'); return; }
    try { await Backend.setBusinessIntegration(bizId, provider, key); appToast('Provider key saved.', 'success'); body.querySelector('.int-key').value=''; }
    catch(err){ appToast('Failed: ' + err.message, 'error'); }
  });

  body.querySelector('.ingest-guide-btn').addEventListener('click', async function(){
    var text = body.querySelector('.guide-text').value.trim();
    if (!text){ appToast('Paste some guide text first.', 'error'); return; }
    var btn = body.querySelector('.ingest-guide-btn');
    btn.disabled = true; btn.textContent = 'Ingesting…';
    try {
      var result = await Backend.ingestGuide(bizId, text);
      appToast('Ingested ' + result.chunksCreated + ' chunks.', 'success');
      var previewEl = body.querySelector('.ingest-preview');
      var n = Math.min(previewDepth.getValue(), result.chunkIds.length);
      previewEl.innerHTML = '<p style="font-size:0.78rem; color:var(--text-muted);">Showing ' + n + ' of ' + result.chunkIds.length + ' created chunk IDs (local preview only):</p>' +
        '<div style="font-family:ui-monospace,monospace; font-size:0.74rem; color:var(--text-faint);">' + result.chunkIds.slice(0, n).map(escapeHtml).join('<br/>') + '</div>';
    } catch(err){ appToast('Failed: ' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Ingest guide'; }
  });
});
</script>
</body>
</html>
